<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Snake Classic Mobile</title>
<style>
  :root {
    --size: min(90vw, 90vh);
    --tile: 20;
  }

  body {
    background: linear-gradient(180deg, #000015, #001f3f);
    color: #00ffff;
    font-family: monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
    height: 100vh;
    overflow: hidden;
  }

  h1 {
    font-size: 1.5em;
    margin-top: 10px;
    text-shadow: 0 0 10px #00ffff;
  }

  canvas {
    width: var(--size);
    height: var(--size);
    background: #000820;
    border: 3px solid #00ffff;
    box-shadow: 0 0 20px #0033aa inset;
    touch-action: none;
  }

  #score {
    font-size: 1.2em;
    margin: 10px;
    text-shadow: 0 0 8px #00ffff;
  }

  #controls {
    display: grid;
    grid-template-columns: repeat(3, 80px);
    grid-template-rows: repeat(3, 80px);
    gap: 10px;
    justify-content: center;
    align-items: center;
    margin-bottom: 10px;
  }

  button {
    background: rgba(0, 50, 80, 0.5);
    color: #00ffff;
    border: 2px solid #00bcd4;
    font-size: 1.5em;
    border-radius: 15px;
    transition: 0.1s;
    touch-action: manipulation;
    box-shadow: 0 0 8px #0099ff;
  }

  button:active {
    background: #00ffff;
    color: black;
  }

  #restart {
    background: #002244;
    color: #00ffff;
    border-radius: 10px;
    font-size: 1.1em;
    padding: 10px 25px;
    border: 2px solid #00bcd4;
    box-shadow: 0 0 10px #00bcd4;
  }

  #restart:active {
    background: #00ffff;
    color: black;
  }

  @media (max-width: 600px) {
    #controls {
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(3, 60px);
      gap: 8px;
    }
    button {
      font-size: 1.3em;
    }
  }
</style>
</head>
<body>
  <h1>🐍 Classic Snake</h1>
  <div id="score">Score: 0</div>
  <canvas id="game"></canvas>

  <div id="controls">
    <div></div>
    <button id="up">⬆️</button>
    <div></div>
    <button id="left">⬅️</button>
    <button id="down">⬇️</button>
    <button id="right">➡️</button>
  </div>

  <button id="restart">🔄 Restart</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let tileSize = 20;
let rows, cols;
let snake, food, dir, nextDir, score, speed, lastTime;
let obstacles = [];

function resizeCanvas() {
  const size = Math.min(window.innerWidth * 0.9, window.innerHeight * 0.7);
  canvas.width = canvas.height = Math.floor(size / tileSize) * tileSize;
  rows = canvas.height / tileSize;
  cols = canvas.width / tileSize;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function init() {
  snake = [{ x: Math.floor(cols / 2), y: Math.floor(rows / 2) }];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  speed = 6;
  obstacles = [];
  placeFood();
  lastTime = 0;
  document.getElementById("score").textContent = "Score: " + score;
  window.cancelAnimationFrame(loop);
  loop(0);
}

function randomFreePosition() {
  let pos;
  do {
    pos = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) };
  } while (
    snake.some(s => s.x === pos.x && s.y === pos.y) ||
    obstacles.some(o => o.x === pos.x && o.y === pos.y) ||
    (food && pos.x === food.x && pos.y === food.y)
  );
  return pos;
}

function placeFood() {
  food = randomFreePosition();
}

function addObstacle() {
  const newObs = randomFreePosition();
  obstacles.push(newObs);
}

function update() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // Wrap around edges
  if (head.x < 0) head.x = cols - 1;
  if (head.y < 0) head.y = rows - 1;
  if (head.x >= cols) head.x = 0;
  if (head.y >= rows) head.y = 0;

  // Check collision with self
  for (let part of snake) {
    if (part.x === head.x && part.y === head.y) {
      alert("💀 Game Over! Score: " + score);
      init();
      return;
    }
  }

  // Check collision with obstacles
  for (let obs of obstacles) {
    if (head.x === obs.x && head.y === obs.y) {
      alert("💥 You hit an obstacle! Final Score: " + score);
      init();
      return;
    }
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById("score").textContent = "Score: " + score;
    placeFood();

    // Add obstacle every multiple of 5
    if (score % 5 === 0) addObstacle();

    if (speed < 14) speed += 0.3; // Increase difficulty gradually
  } else {
    snake.pop();
  }
}

function draw() {
  ctx.fillStyle = "#000820";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw snake
  for (let [i, s] of snake.entries()) {
    ctx.fillStyle = i === 0 ? "#00ffff" : "#0077ff";
    ctx.fillRect(s.x * tileSize, s.y * tileSize, tileSize, tileSize);
  }

  // Draw food
  ctx.fillStyle = "#ff6600";
  ctx.fillRect(food.x * tileSize, food.y * tileSize, tileSize, tileSize);

  // Draw obstacles
  ctx.fillStyle = "#004466";
  obstacles.forEach(o => {
    ctx.fillRect(o.x * tileSize, o.y * tileSize, tileSize, tileSize);
  });
}

function loop(timestamp) {
  const delta = (timestamp - lastTime) / 1000;
  if (delta > 1 / speed) {
    update();
    draw();
    lastTime = timestamp;
  }
  window.requestAnimationFrame(loop);
}

// Keyboard controls
document.addEventListener("keydown", e => {
  if ((e.key === "ArrowUp" || e.key === "w") && dir.y === 0)
    nextDir = { x: 0, y: -1 };
  else if ((e.key === "ArrowDown" || e.key === "s") && dir.y === 0)
    nextDir = { x: 0, y: 1 };
  else if ((e.key === "ArrowLeft" || e.key === "a") && dir.x === 0)
    nextDir = { x: -1, y: 0 };
  else if ((e.key === "ArrowRight" || e.key === "d") && dir.x === 0)
    nextDir = { x: 1, y: 0 };
});

// On-screen button controls
function control(id, x, y) {
  document.getElementById(id).addEventListener("touchstart", e => {
    e.preventDefault();
    if ((x !== 0 && dir.x === 0) || (y !== 0 && dir.y === 0))
      nextDir = { x, y };
  });
}
control("up", 0, -1);
control("down", 0, 1);
control("left", -1, 0);
control("right", 1, 0);

// Restart button
document.getElementById("restart").addEventListener("click", init);

// Start game
init();
</script>
</body>
</html>
