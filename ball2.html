
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rapid Bomb Catcher</title>
  <style>
    :root {
      --bg: #000;
      --panel: #041229;
      --accent: #0b63a6;
      --text: #e6f0fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #gameContainer {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      background: var(--bg);
    }

    canvas {
      background: var(--bg); /* Solid black */
      border-radius: 10px;
      width: 100%;
      max-height: 100%;
      display: block;
      touch-action: none;
    }

    #panel {
      width: 100%;
      background: var(--panel);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px;
      font-size: 14px;
      justify-content: space-between;
    }

    .stat {
      flex: 1 1 45%;
      display: flex;
      justify-content: space-between;
      padding: 6px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      min-width: 120px;
    }

    button, select {
      background: var(--accent);
      border: none;
      color: white;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }

    button:hover, select:hover {
      background: #1587d6;
    }

    #gameOver {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 2em;
      z-index: 10;
      visibility: hidden;
      text-align: center;
      padding: 20px;
    }

    #gameOver button {
      margin-top: 20px;
      font-size: 0.6em;
      padding: 10px 20px;
    }

    @media (max-width: 600px) {
      .stat { flex: 1 1 100%; }
    }
  </style>
</head>
<body>

  <div id="gameContainer">
    <canvas id="game"></canvas>
    <div id="gameOver">
      <div>💣 BOOM! You Caught a Bomb!</div>
      <button id="restartAfterGameOver">Restart</button>
    </div>
  </div>

  <div id="panel">
    <div class="stat"><span>Score</span><strong id="score">0</strong></div>
    <div class="stat"><span>High Score</span><strong id="highscore">0</strong></div>
    <label style="flex: 1 1 100%;">
      Difficulty:
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="normal" selected>Normal</option>
        <option value="hard">Hard</option>
      </select>
    </label>
    <button id="restartBtn">Restart Round</button>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score");
    const highEl = document.getElementById("highscore");
    const diffEl = document.getElementById("difficulty");
    const restartBtn = document.getElementById("restartBtn");
    const restartAfterGameOver = document.getElementById("restartAfterGameOver");
    const gameOverDiv = document.getElementById("gameOver");

    const DIFF = {
      easy: { spawn: 900, speed: 250, cWidth: 140 },
      normal: { spawn: 500, speed: 400, cWidth: 120 },
      hard: { spawn: 200, speed: 700, cWidth: 100 }
    };

    let balls = [];
    let keys = { left: false, right: false, up: false, down: false };
    let score = 0;
    let highscore = Number(localStorage.getItem("bomb-highscore") || 0);
    let difficulty = "normal";
    let lastSpawn = 0;
    let isGameOver = false;
    let loopRunning = false;

    let catcher = {
      w: DIFF[difficulty].cWidth,
      h: 18,
      x: 100,
      y: 100,
      speed: 650
    };

    highEl.textContent = highscore;

    function resizeCanvas() {
      const ratio = window.devicePixelRatio || 1;
      const width = window.innerWidth;
      const height = window.innerHeight * 0.6;

      canvas.width = width;
      canvas.height = height;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";

      catcher.x = width / 2 - catcher.w / 2;
      catcher.y = height - 40;
    }

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    diffEl.onchange = (e) => {
      difficulty = e.target.value;
      restartGame();
    };

    restartBtn.onclick = restartGame;
    restartAfterGameOver.onclick = restartGame;

    window.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      if (k === 'a' || k === 'arrowleft') keys.left = true;
      if (k === 'd' || k === 'arrowright') keys.right = true;
      if (k === 'w' || k === 'arrowup') keys.up = true;
      if (k === 's' || k === 'arrowdown') keys.down = true;
    });

    window.addEventListener("keyup", (e) => {
      const k = e.key.toLowerCase();
      if (k === 'a' || k === 'arrowleft') keys.left = false;
      if (k === 'd' || k === 'arrowright') keys.right = false;
      if (k === 'w' || k === 'arrowup') keys.up = false;
      if (k === 's' || k === 'arrowdown') keys.down = false;
    });

    // Touch drag
    let isDragging = false;
    canvas.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      const x = t.clientX - rect.left;
      const y = t.clientY - rect.top;
      if (x >= catcher.x && x <= catcher.x + catcher.w && y >= catcher.y && y <= catcher.y + catcher.h) {
        isDragging = true;
      }
    });

    canvas.addEventListener("touchmove", (e) => {
      if (isDragging) {
        const t = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        catcher.x = t.clientX - rect.left - catcher.w / 2;
        catcher.x = Math.max(0, Math.min(canvas.width - catcher.w, catcher.x));
      }
    });

    canvas.addEventListener("touchend", () => {
      isDragging = false;
    });

    function spawnObjects() {
      if (Math.random() < 0.6) {
        const r = 12 + Math.random() * 6;
        const x = r + Math.random() * (canvas.width - 2 * r);
        balls.push({ x, y: -r, r, vy: DIFF[difficulty].speed, type: "ball", color: "dodgerblue" });
      }

      const r2 = 12 + Math.random() * 8;
      const x2 = r2 + Math.random() * (canvas.width - 2 * r2);
      balls.push({ x: x2, y: -r2, r: r2, vy: DIFF[difficulty].speed, type: "bomb", color: "crimson" });
    }

    function update(dt) {
      if (keys.left) catcher.x -= catcher.speed * dt;
      if (keys.right) catcher.x += catcher.speed * dt;
      if (keys.up) catcher.y -= catcher.speed * 0.5 * dt;
      if (keys.down) catcher.y += catcher.speed * 0.5 * dt;

      catcher.x = Math.max(0, Math.min(canvas.width - catcher.w, catcher.x));
      catcher.y = Math.max(0, Math.min(canvas.height - 30, catcher.y));

      if (performance.now() - lastSpawn > DIFF[difficulty].spawn) {
        spawnObjects();
        lastSpawn = performance.now();
      }

      for (let i = balls.length - 1; i >= 0; i--) {
        const b = balls[i];
        b.y += b.vy * dt;

        if (
          b.y + b.r > catcher.y &&
          b.x > catcher.x &&
          b.x < catcher.x + catcher.w
        ) {
          if (b.type === "bomb") {
            endGame();
            return;
          } else {
            score++;
            scoreEl.textContent = score;
            balls.splice(i, 1);
          }
        } else if (b.y > canvas.height + 50) {
          balls.splice(i, 1);
        }
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#0b63a6";
      ctx.fillRect(catcher.x, catcher.y, catcher.w, catcher.h);

      for (const b of balls) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();

        if (b.type === "bomb") {
          ctx.beginPath();
          ctx.moveTo(b.x - 5, b.y - 10);
          ctx.lineTo(b.x + 5, b.y - 10);
          ctx.strokeStyle = "#fff";
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }
    }

    let last = performance.now();
    function loop(now) {
      if (isGameOver) {
        loopRunning = false;
        render();
        return;
      }
      loopRunning = true;
      const dt = Math.min((now - last) / 1000, 0.033);
      last = now;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);

    function endGame() {
      isGameOver = true;
      gameOverDiv.style.visibility = "visible";
      if (score > highscore) {
        highscore = score;
        highEl.textContent = highscore;
        localStorage.setItem("bomb-highscore", highscore);
      }
    }

    function restartGame() {
      balls = [];
      catcher.w = DIFF[difficulty].cWidth;
      catcher.x = canvas.width / 2 - catcher.w / 2;
      catcher.y = canvas.height - 40;
      score = 0;
      scoreEl.textContent = 0;
      isGameOver = false;
      gameOverDiv.style.visibility = "hidden";
      lastSpawn = performance.now();
      if (!loopRunning) {
        last = performance.now();
        loopRunning = true;
        requestAnimationFrame(loop);
      }
    }
  </script>
</body>
</html>
